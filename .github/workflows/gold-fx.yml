name: Gold FX

on:
  push:
    paths:
      - 'gold-fx/**'
      - '.github/workflows/gold-fx.yml'
  pull_request:
    paths:
      - 'gold-fx/**'
      - '.github/workflows/gold-fx.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gold-fx
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: gold-fx/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
